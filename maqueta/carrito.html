<!DOCTYPE html>
<!-- Propuesta de rediseño de la compra de corlima.pe — documento de trabajo interno.
     No es el sitio real: nada envía datos y la página no se indexa. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Carrito — Corlima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<main class="cuerpo">
  <div class="caja">
    <div data-pasos></div>

    <div class="titulo">
      <h1>Tu carro</h1>
      <span id="cuenta">2 productos</span>
    </div>

    <div class="cols">
      <section class="lista" id="lista" aria-label="Productos en el carro"></section>
      <aside class="resumen" data-resumen aria-label="Resumen de la orden"></aside>
    </div>

    <a class="volver" href="#" id="seguir"></a>
  </div>
</main>

<div class="movil">
  <div>
    <div class="m-t">Total</div>
    <div class="m-n" id="mTotal">S/ 0,00</div>
  </div>
  <button class="cta" type="button" id="ctaMovil">Continuar compra</button>
</div>

<div class="undo" id="undo" role="status">
  <span id="undoTxt">Producto quitado</span>
  <button type="button" id="undoBtn">Deshacer</button>
</div>

<script src="tienda.js"></script>
<script>
(function(){
  var S = Tienda.SVG, est = Tienda.estado;
  var quitado = null, timer = null;

  document.getElementById('seguir').innerHTML = S.izq + ' Seguir comprando';

  function off(it){ return Math.round((1 - it.precio / it.original) * 100); }

  function pintar(){
    var lista = document.getElementById('lista');
    if(!est.items.length){
      lista.innerHTML = '<div class="vacio"><p>Tu carro está vacío.</p>'+
        '<button class="cta" type="button" style="max-width:240px;margin:0 auto" onclick="location.reload()">Ver productos</button></div>';
    } else {
      lista.innerHTML = est.items.map(function(it){
        return '<article class="item">'+
          '<div class="item-img"><img src="'+it.img+'" alt="" loading="lazy"></div>'+
          '<div><a class="nombre" href="#">'+it.nombre+'</a>'+
            '<div class="tags"><span class="tag">'+S.camion+'Llega mañana</span>'+
            '<span class="tag tienda">'+S.tienda+'Retira hoy en tienda</span></div>'+
            '<div class="precios"><span class="p-final">'+Tienda.money(it.precio*it.qty)+'</span>'+
            '<span class="p-viejo">'+Tienda.money(it.original*it.qty)+'</span>'+
            '<span class="p-off">-'+off(it)+'%</span></div></div>'+
          '<div class="derecha">'+
            '<button class="quitar" data-quitar="'+it.id+'" aria-label="Quitar '+it.nombre+'">'+S.tacho+'</button>'+
            '<div class="stepper">'+
              '<button data-menos="'+it.id+'" aria-label="Quitar una unidad"'+(it.qty<=1?' disabled':'')+'>'+S.menos+'</button>'+
              '<span class="n">'+it.qty+'</span>'+
              '<button data-mas="'+it.id+'" aria-label="Agregar una unidad">'+S.mas+'</button>'+
            '</div></div></article>';
      }).join('');
    }
    refrescar();
  }

  function refrescar(){
    var t = Tienda.resumen({
      texto:'Continuar compra',
      activo: est.items.length > 0,
      alSeguir: function(){ Tienda.irA('entrega.html'); }
    });
    document.getElementById('cuenta').textContent = t.unidades === 1 ? '1 producto' : t.unidades + ' productos';
    Tienda.guardar();
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var id;
    if((id = b.getAttribute('data-mas'))){
      est.items.forEach(function(it){ if(it.id == id) it.qty++; }); pintar();
    } else if((id = b.getAttribute('data-menos'))){
      est.items.forEach(function(it){ if(it.id == id && it.qty > 1) it.qty--; }); pintar();
    } else if((id = b.getAttribute('data-quitar'))){
      var i = est.items.findIndex(function(it){ return it.id == id; });
      if(i > -1){ quitado = { it: est.items[i], i: i }; est.items.splice(i,1); pintar(); avisar(); }
    }
  });

  function avisar(){
    var u = document.getElementById('undo');
    document.getElementById('undoTxt').textContent = 'Quitaste "' + quitado.it.nombre.split('—')[0].trim() + '"';
    u.classList.add('ver');
    clearTimeout(timer);
    timer = setTimeout(function(){ u.classList.remove('ver'); quitado = null; }, 6000);
  }
  document.getElementById('undoBtn').onclick = function(){
    if(!quitado) return;
    est.items.splice(quitado.i, 0, quitado.it); quitado = null;
    document.getElementById('undo').classList.remove('ver'); pintar();
  };

  document.addEventListener('submit', function(e){ e.preventDefault(); });

  Tienda.iniciar(1, { texto:'Continuar compra', activo:false });
  pintar();
})();
</script>
</body>
</html>
